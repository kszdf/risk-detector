# 放置路径：/etc/nginx/conf.d/api.zmgen.cn.conf
# 证书由 certbot 签发，签发前请先注释掉 443 段，只保留 80 段完成验证

upstream risk_api {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    server_name api.zmgen.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.zmgen.cn;

    ssl_certificate     /etc/letsencrypt/live/api.zmgen.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zmgen.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 20m;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    location / {
        proxy_pass http://risk_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
