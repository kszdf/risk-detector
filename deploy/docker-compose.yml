services:
  risk-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: risk-detector-api:latest
    container_name: risk-detector-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    env_file:
      - ../deploy/.env
    environment:
      - NODE_ENV=production
      - PORT=3100
